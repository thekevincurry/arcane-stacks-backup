services:
  booklore:
    image: ghcr.io/booklore-app/booklore:latest
    container_name: booklore
    restart: unless-stopped
    networks:
      - booklore_net
    ports:
      - "6060:6060"
    environment:
      - USER_ID=1000
      - GROUP_ID=1000
      - TZ=America/Denver
      - DATABASE_URL=jdbc:mariadb://booklore-mariadb:3306/booklore
      - DATABASE_USERNAME=booklore
      - DATABASE_PASSWORD=${BOOKLORE_DB_PASSWORD}
      - SWAGGER_ENABLED=false
      - FORCE_DISABLE_OIDC=false
    volumes:
      - /home/docker/booklore/data:/app/data
      - /media/Blackbox/data/media/books:/books
      - /home/docker/booklore/bookdrop:/bookdrop
    depends_on:
      booklore-mariadb:
        condition: service_healthy

  booklore-mariadb:
    image: lscr.io/linuxserver/mariadb:11.4.8
    container_name: booklore-mariadb
    restart: unless-stopped
    networks:
      - booklore_net
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Denver
      - MYSQL_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MYSQL_DATABASE=booklore
      - MYSQL_USER=booklore
      - MYSQL_PASSWORD=${BOOKLORE_DB_PASSWORD}
    volumes:
      - booklore_mariadb_config:/config
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  booklore_net:
    external: true

volumes:
  booklore_mariadb_config:
    external: true
