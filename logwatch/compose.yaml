# Static web server for the daily AI log-review reports.
# The reports are generated by /home/docker/logwatch/logwatch.py, run as root by the
# systemd timer logwatch.timer (06:00 daily). This project only serves the output.
# Public access: Cloudflare Tunnel route logwatch.masterbateshome.com -> logwatch-web:80,
# behind Cloudflare Access.
services:
  logwatch-web:
    image: nginx:alpine
    container_name: logwatch-web
    restart: unless-stopped
    volumes:
      - /home/docker/logwatch/reports:/usr/share/nginx/html:ro
    networks:
      - super_1_1_default   # Homepage checks it here
      - npm-network         # the Cloudflare tunnel reaches it here

networks:
  super_1_1_default:
    external: true
  npm-network:
    external: true
