services:
  docker-socket-proxy-arcane:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy-arcane
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - VOLUMES=1
      - POST=1
      - INFO=1
      - PING=1
      - VERSION=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  arcane:
    image: ghcr.io/getarcaneapp/manager:latest
    container_name: arcane
    restart: unless-stopped
    ports:
      - "3552:3552"
    environment:
      - DOCKER_HOST=tcp://docker-socket-proxy-arcane:2375
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - PROJECTS_DIRECTORY=/host/arcane-projects
      - TZ=America/Denver
    volumes:
      - arcane-data:/app/data
      - /home/docker/arcane-projects:/host/arcane-projects
    cgroup: host
    depends_on:
      - docker-socket-proxy-arcane

volumes:
  arcane-data:
    external: true
