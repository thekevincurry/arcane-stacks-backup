services:
  ephemera:
    build:
      context: ./src
    image: ephemera:local
    container_name: ephemera
    restart: unless-stopped
    ports:
      - "8286:8286"
    environment:
      - AA_BASE_URL=https://annas-archive.gl/
      - FLARESOLVERR_URL=http://192.168.1.54:8191
      - PUID=1000
      - PGID=1000
    volumes:
      - /home/docker/ephemera/data:/app/data
      - /home/docker/ephemera/downloads:/app/downloads
      - /home/docker/ephemera/ingest:/app/ingest
