#==============================================================================
# Portainer Stack: mystack
# - All credentials sourced from .env
# - Healthchecks added for auto-heal coverage (Arcane auto-heal since 2026-11-04; autoheal=true labels are now informational)
# - WireGuard (Gluetun) + qBittorrent added for VPN'd torrenting
#==============================================================================

#==============================================================================
# SERVICES
#==============================================================================
services:

  # ---------------------------------------------------------------------------
  # System & Container Maintenance
  # ---------------------------------------------------------------------------

  docker-socket-proxy-ro:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy-ro
    labels:
      com.centurylinklabs.watchtower.monitor-only: "false"
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - INFO=1
      - PING=1
      - VERSION=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default

  docker-socket-proxy-watchtower:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy-watchtower
    labels:
      com.centurylinklabs.watchtower.monitor-only: "false"
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - POST=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default

  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    labels:
      com.centurylinklabs.watchtower.monitor-only: "false"
    restart: unless-stopped
    # Notify-only by default; containers labelled watchtower.monitor-only=false are updated automatically.
    command: --schedule "0 0 5 * * *" --cleanup --monitor-only --label-take-precedence --notification-report --no-startup-message --http-api-metrics
    # --http-api-metrics: read-only scan/update/fail counts on :8080 (token-protected) for the Homepage tile.
    # It does not enable --http-api-update, so the 05:00 schedule is unchanged.
    depends_on:
      - docker-socket-proxy-watchtower
    environment:
      - TZ=${TZ}
      - DOCKER_HOST=tcp://docker-socket-proxy-watchtower:2375
      - WATCHTOWER_NOTIFICATION_URL=${WATCHTOWER_NOTIFICATION_URL}
      - WATCHTOWER_NOTIFICATIONS_HOSTNAME=homeserver
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_API_TOKEN}
      - WATCHTOWER_NOTIFICATION_TITLE_TAG=Watchtower
      - |
        WATCHTOWER_NOTIFICATION_TEMPLATE=
        {{- if .Report -}}{{- with .Report -}}
        {{- if (or .Updated .Failed .Stale) -}}
        {{- range .Updated}}✅ Updated {{.Name}} ({{.ImageName}})
        {{end -}}
        {{- range .Stale}}⬆️ Update available: {{.Name}} ({{.ImageName}})
        {{end -}}
        {{- range .Failed}}❌ Update failed: {{.Name}}: {{.Error}}
        {{end -}}
        {{- end -}}{{- end -}}{{- end -}}

  speedtest:
    # Speedtest Tracker by Alex Justesen (maintained successor to henrywhitaker3's, replaced 2026-11-04).
    # Container name and port kept so the tunnel route and Homepage need no changes.
    # Old data stays in ${DOCKER_CONFIG_PATH}/speedtest (not mounted).
    image: lscr.io/linuxserver/speedtest-tracker:latest
    container_name: speedtest
    labels:
      com.centurylinklabs.watchtower.monitor-only: "false"
    restart: unless-stopped
    ports:
      - "8765:80"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - APP_KEY=${SPEEDTEST_APP_KEY}
      - APP_URL=https://speedtest.masterbateshome.com
      - DB_CONNECTION=sqlite
      - DISPLAY_TIMEZONE=${TZ}
      - SPEEDTEST_SCHEDULE=0 * * * *
      - PRUNE_RESULTS_OLDER_THAN=0
    volumes:
      - ${DOCKER_CONFIG_PATH}/speedtest-tracker:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/api/healthcheck > /dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-file: "10"
        max-size: "1000k"
    networks:
      - npm-network
      - default

  # ---------------------------------------------------------------------------
  # Networking, DNS & Reverse Proxy
  # ---------------------------------------------------------------------------

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    labels:
      autoheal: "true"
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    environment:
      - TZ=${TZ}
      - DB_SQLITE_FILE=${NPM_DB_SQLITE_FILE}
    volumes:
      - ${DOCKER_CONFIG_PATH}/npm/data:/data
      - ${DOCKER_CONFIG_PATH}/npm/letsencrypt:/etc/letsencrypt
    networks:
      - npm-network
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/check-health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  cloudflare-ddns:
    image: favonia/cloudflare-ddns:latest
    container_name: cloudflare-ddns
    labels:
      com.centurylinklabs.watchtower.monitor-only: "false"
    network_mode: host
    restart: always
    read_only: true
    cap_drop:
      - all
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - CF_API_TOKEN=${CF_API_TOKEN}
      - DOMAINS=${CF_DOMAINS}
      - PROXIED=${CF_PROXIED}

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.monitor-only: "false"
      autoheal: "true"
    ports:
      - "${FLARESOLVERR_PORT:-8191}:8191"
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=${FLARESOLVERR_LOG_LEVEL}
      - LOG_HTML=${FLARESOLVERR_LOG_HTML}
      - CAPTCHA_SOLVER=${FLARESOLVERR_CAPTCHA_SOLVER}
    networks:
      - npm-network
      - default
    healthcheck:
      # The image ships curl, not wget (wget-based check failed and autoheal restart-looped it, Oct 2026).
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8191/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Dashboard
  # ---------------------------------------------------------------------------

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.monitor-only: "false"
      autoheal: "true"
    user: "${PUID}:${PGID}"
    ports:
      - "3000:3000"
    depends_on:
      - docker-socket-proxy-ro
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_ALLOWED_HOSTS}
      # Widget secrets live in files (see /home/docker/homepage/secrets, mode 600):
      - HOMEPAGE_FILE_UNIFI_PASSWORD=/app/config/secrets/UNIFI_PASSWORD
      - HOMEPAGE_FILE_UNIFI_KEY=/app/config/secrets/UNIFI_KEY
      - HOMEPAGE_FILE_SPEEDTEST_KEY=/app/config/secrets/SPEEDTEST_KEY
      - HOMEPAGE_FILE_NPM_PASSWORD=/app/config/secrets/NPM_PASSWORD
      - HOMEPAGE_FILE_PAPERLESS_PASSWORD=/app/config/secrets/PAPERLESS_PASSWORD
      - HOMEPAGE_FILE_PLEX_KEY=/app/config/secrets/PLEX_KEY
      - HOMEPAGE_FILE_TAUTULLI_KEY=/app/config/secrets/TAUTULLI_KEY
      - HOMEPAGE_FILE_SONARR_KEY=/app/config/secrets/SONARR_KEY
      - HOMEPAGE_FILE_RADARR_KEY=/app/config/secrets/RADARR_KEY
      - HOMEPAGE_FILE_PROWLARR_KEY=/app/config/secrets/PROWLARR_KEY
      - HOMEPAGE_FILE_SEERR_KEY=/app/config/secrets/SEERR_KEY
      - HOMEPAGE_FILE_BLACKBOX_PASSWORD=/app/config/secrets/BLACKBOX_PASSWORD
      - HOMEPAGE_FILE_SABNZBD_KEY=/app/config/secrets/SABNZBD_KEY
      - HOMEPAGE_FILE_CROWDSEC_PASSWORD=/app/config/secrets/CROWDSEC_PASSWORD
      - HOMEPAGE_FILE_GLUETUN_KEY=/app/config/secrets/GLUETUN_KEY
      - HOMEPAGE_FILE_WATCHTOWER_KEY=/app/config/secrets/WATCHTOWER_KEY
      - HOMEPAGE_FILE_ARCANE_KEY=/app/config/secrets/ARCANE_KEY
    volumes:
      - ${DOCKER_CONFIG_PATH}/homepage:/app/config
    networks:
      - npm-network
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Media Server
  # ---------------------------------------------------------------------------

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.monitor-only: "false"
      autoheal: "true"
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "44"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - VERSION=${PLEX_VERSION}
      - PLEX_CLAIM=${PLEX_CLAIM_TOKEN}
    volumes:
      - ${DOCKER_CONFIG_PATH}/plex/config:/config
      - ${DOCKER_CONFIG_PATH}/plex/transcode:/transcode
      - ${MEDIA_BLACKBOX_PATH}/data/media:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:32400/identity > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.monitor-only: "false"
      autoheal: "true"
    ports:
      - "8181:8181"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DOCKER_CONFIG_PATH}/tautulli/config:/config
    networks:
      - npm-network
      - default
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:8181/status > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Seerr replaced the deprecated Jellyseerr (2026-10-14). See https://docs.seerr.dev/migration-guide/
  # Runs as the image's non-root node user (UID 1000); the config dir must be owned by 1000:1000.
  # Pre-migration Jellyseerr data is kept at ${DOCKER_CONFIG_PATH}/overseerr.
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    restart: unless-stopped
    labels:
      autoheal: "true"
    ports:
      - "5055:5055"
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKER_CONFIG_PATH}/seerr:/app/config
    networks:
      - npm-network
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # *arr Suite (Indexer + Movie/TV automation)
  # ---------------------------------------------------------------------------

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.monitor-only: "false"
      autoheal: "true"
    ports:
      - "9696:9696"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DOCKER_CONFIG_PATH}/prowlarr:/config
    networks:
      - npm-network
      - default
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:9696/ping > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.monitor-only: "false"
      autoheal: "true"
    ports:
      - "7878:7878"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DOCKER_CONFIG_PATH}/radarr:/config
      - ${MEDIA_BLACKBOX_PATH}/data:/data
    networks:
      - npm-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:7878/ping > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.monitor-only: "false"
      autoheal: "true"
    ports:
      - "8989:8989"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DOCKER_CONFIG_PATH}/sonarr:/config
      - ${MEDIA_BLACKBOX_PATH}/data:/data
    networks:
      - npm-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:8989/ping > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Download Clients & Post-Processing
  # ---------------------------------------------------------------------------

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.monitor-only: "false"
      autoheal: "true"
    ports:
      - "8085:8080"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DOCKER_CONFIG_PATH}/sabnzbd:/config
      - ${MEDIA_BLACKBOX_PATH}/data/usenet:/data/usenet
    networks:
      - npm-network
    # Long unpacks can stall the web UI for minutes. Only call it unhealthy after ~5 min of failed checks,
    # and give it 2 min to finish/abort an unrar on stop (an auto-heal restart killed it mid-unpack on
    # 2026-11-08 and left it stopped).
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL -m 25 http://localhost:8080/ > /dev/null || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s

  rdtclient:
    image: rogerfar/rdtclient:latest
    container_name: rdtclient
    restart: always
    labels:
      autoheal: "true"
    ports:
      - "6500:6500"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DOCKER_CONFIG_PATH}/rdtclient:/data/db
      - ${MEDIA_BLACKBOX_PATH}/data/torrents/completed:/data/downloads
    logging:
      driver: json-file
      options:
        max-size: 10m
    networks:
      - npm-network
      - default
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:6500/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  unpackerr:
    image: golift/unpackerr:latest
    container_name: unpackerr
    labels:
      com.centurylinklabs.watchtower.monitor-only: "false"
    restart: always
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ}
      - UN_SONARR_0_URL=${UNPACKERR_SONARR_0_URL}
      - UN_SONARR_0_API_KEY=${UNPACKERR_SONARR_0_API_KEY}
      - UN_RADARR_0_URL=${UNPACKERR_RADARR_0_URL}
      - UN_RADARR_0_API_KEY=${UNPACKERR_RADARR_0_API_KEY}
    volumes:
      - ${MEDIA_BLACKBOX_PATH}/data:/downloads
      - ${DOCKER_CONFIG_PATH}/unpackerr/logs:/data/logs

  # ---------------------------------------------------------------------------
  # VPN + qBittorrent (Gluetun routes qBittorrent through ProtonVPN WireGuard)
  # ---------------------------------------------------------------------------

  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    ports:
      - "${QBIT_WEBUI_PORT:-8090}:${QBIT_WEBUI_PORT:-8090}"
      - "${QBIT_TORRENT_PORT:-6881}:${QBIT_TORRENT_PORT:-6881}"
      - "${QBIT_TORRENT_PORT:-6881}:${QBIT_TORRENT_PORT:-6881}/udp"
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - SERVER_COUNTRIES=${PROTONVPN_SERVER_COUNTRIES}
      - SERVER_CITIES=${PROTONVPN_SERVER_CITIES}
      - SERVER_NAMES=${PROTONVPN_SERVER_NAMES}
      - FIREWALL_OUTBOUND_SUBNETS=${LAN_SUBNET},172.16.0.0/12
      - DNS_SERVER=on
      - WIREGUARD_MTU=1280
      # ---- Port forwarding ----
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=protonvpn
      # Run this whenever Proton hands out a new port. qBit shares this
      # container's netns, so 127.0.0.1:WEBUI_PORT IS the qBit WebUI.
      # qBit often isn't up yet when this runs (boot, or both containers restarting), so it
      # retries every 5 s for up to 5 minutes. ($$ is compose's escape for a literal $.)
      - 'VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c ''for i in $$(seq 1 60); do wget -qO- --post-data "json={\"listen_port\":{{PORTS}}}" http://127.0.0.1:${QBIT_WEBUI_PORT:-8090}/api/v2/app/setPreferences && exit 0; sleep 5; done; exit 1'''
    volumes:
      - ${DOCKER_CONFIG_PATH}/gluetun:/gluetun
    networks:
      - npm-network
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=${QBIT_WEBUI_PORT:-8090}
      - TORRENTING_PORT=${QBIT_TORRENT_PORT:-6881}
    volumes:
      - ${DOCKER_CONFIG_PATH}/qbittorrent:/config
      - ${MEDIA_BLACKBOX_PATH}/data/torrents:/data/torrents
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:${QBIT_WEBUI_PORT:-8090}/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Profilarr (Sonarr/Radarr quality-profile & custom-format manager)
  # ---------------------------------------------------------------------------

  profilarr:
    image: ghcr.io/dictionarry-hub/profilarr:latest
    container_name: profilarr
    restart: unless-stopped
    depends_on:
      profilarr-parser:
        condition: service_healthy
    ports:
      - "6868:6868"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=022
      - TZ=${TZ}
      # Required when accessing Profilarr through your reverse proxy
      - ORIGIN=https://profilarr.${MY_DOMAIN}
      # Internal link to the parser sidecar for CF/QP testing
      - PARSER_HOST=profilarr-parser
      - PARSER_PORT=5000
    volumes:
      - ${DOCKER_CONFIG_PATH}/profilarr:/config
    networks:
      - npm-network
      - default
    # No healthcheck: startup and sync work outlast any reasonable timeout, and autoheal
    # then restart-looped it (Sep 2026). The restart policy still recovers real crashes.
    healthcheck:
      disable: true

  profilarr-parser:
    # Optional sidecar — only needed for custom-format / quality-profile testing.
    # Linking, syncing, and pulling TRaSH guides work fine without it; remove
    # this service and the PARSER_* vars above if you'd rather skip it.
    image: ghcr.io/dictionarry-hub/profilarr-parser:latest
    container_name: profilarr-parser
    restart: unless-stopped
    labels:
      autoheal: "true"
    expose:
      - "5000"
    environment:
      - TZ=${TZ}
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Audio Bridging
  # ---------------------------------------------------------------------------

  airconnect-sonos:
    image: 1activegeek/airconnect:latest
    container_name: airconnect_sonos
    labels:
      com.centurylinklabs.watchtower.monitor-only: "false"
    network_mode: host
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKER_CONFIG_PATH}/airconnect:/config

  # ---------------------------------------------------------------------------
  # Backup
  # ---------------------------------------------------------------------------

  duplicati:
    image: lscr.io/linuxserver/duplicati:latest
    container_name: duplicati
    restart: unless-stopped
    labels:
      autoheal: "true"
    ports:
      - "8200:8200"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - SETTINGS_ENCRYPTION_KEY=${DUPLICATI_ENCRYPTION_KEY}
      - DUPLICATI__WEBSERVICE_PASSWORD=${DUPLICATI_WEBSERVICE_PASSWORD}
    volumes:
      - ${DOCKER_CONFIG_PATH}/duplicati/config:/config
      - ${DOCKER_CONFIG_PATH}/duplicati/backups:/backups
      - /home:/source
      # Second backup destination: Synology Blackbox (NFS at /media/Blackbox). Fail instead of writing
      # to the local disk if the NAS folder isn't there.
      - type: bind
        source: /media/Blackbox/Backups/Duplicati-HomeServer
        target: /nas-backup
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:8200/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Document Management (Paperless-NGX + Redis)
  # ---------------------------------------------------------------------------

  paperless-ngx:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless_ngx
    restart: unless-stopped
    labels:
      autoheal: "true"
    depends_on:
      - paperless-redis
      - tika
      - gotenberg
    ports:
      - "${PAPERLESS_PORT_HOST}:8000"
    environment:
      USERMAP_UID: ${PUID}
      USERMAP_GID: ${PGID}
      PAPERLESS_REDIS: redis://${PAPERLESS_REDIS_HOST}:${PAPERLESS_REDIS_PORT}
      PAPERLESS_DBENGINE: sqlite
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      PAPERLESS_TIME_ZONE: ${TZ}
      PAPERLESS_OCR_LANGUAGES: ${PAPERLESS_OCR_LANGUAGES}
      PAPERLESS_CONSUMPTION_DIR: /usr/src/paperless/consume
      PAPERLESS_DATA_DIR: /usr/src/paperless/data
      PAPERLESS_MEDIA_ROOT: /usr/src/paperless/media
      PAPERLESS_EXPORT_DIR: /usr/src/paperless/export
      PAPERLESS_URL: https://paperless.${MY_DOMAIN}
      PAPERLESS_CSRF_TRUSTED_ORIGINS: https://*.${MY_DOMAIN}
      PAPERLESS_CORS_ALLOWED_HOSTS: https://paperless.${MY_DOMAIN}
      # Tika + Gotenberg turn .eml bodies and Office files into documents.
      PAPERLESS_TIKA_ENABLED: "true"
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
    volumes:
      - ${PAPERLESS_DATA_DIR_HOST}:/usr/src/paperless/data
      - ${PAPERLESS_MEDIA_DIR_HOST}:/usr/src/paperless/media
      - ${PAPERLESS_CONSUME_DIR_HOST}:/usr/src/paperless/consume
      - ${PAPERLESS_EXPORT_DIR_HOST}:/usr/src/paperless/export
      - /etc/localtime:/etc/localtime:ro
    networks:
      - npm-network
      - default
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:8000/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # Tika must stay on 2.x: Tika 4 rejects the JSON request paperless-ngx's client
  # sends (HTTP 406 on /tika/text), which breaks .eml consumption.
  tika:
    image: apache/tika:2.9.2.1-full
    container_name: tika
    restart: unless-stopped
    networks:
      - default

  # Don't add --chromium-disable-routes: Paperless needs /forms/chromium/convert/html.
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: gotenberg
    labels:
      com.centurylinklabs.watchtower.monitor-only: "false"
    restart: unless-stopped
    networks:
      - default

  paperless-redis:
    image: redis:7-alpine
    container_name: paperless_redis
    restart: unless-stopped
    labels:
      autoheal: "true"
    volumes:
      - ${DOCKER_CONFIG_PATH}/paperless-ngx/redisdata:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

#==============================================================================
# NETWORKS
#==============================================================================
networks:
  npm-network:
    external: true
  # The stack's containers were first created under the old Portainer project
  # "super_1_1" and talk to each other on this network. Using it as the default keeps
  # them together while they move into this project.
  default:
    name: super_1_1_default
    external: true
